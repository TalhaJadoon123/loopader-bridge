[package]
name = "loopader-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
fx-core = "0.1"
fx-utils = "0.1"
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
uuid = { version = "1.7", features = ["v4", "serde"] }